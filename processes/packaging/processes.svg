<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Process Manager: a dark instrument screen in a warm grey bezel, with a
       grid, a CPU trace in Patina orange over its shaded area, and a row of
       three meter bars along the bottom. -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd6c7"/>
      <stop offset="1" stop-color="#b3ab9b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#1b1b1e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8823a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8823a" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect x="8" y="14" width="112" height="100" rx="14" fill="url(#bezel)"/>
  <rect x="8.5" y="14.5" width="111" height="99" rx="13.5" fill="none" stroke="#8a8274" stroke-width="1"/>
  <rect x="18" y="24" width="92" height="58" rx="5" fill="url(#screen)"/>
  <g stroke="#3d3d44" stroke-width="1">
    <line x1="18" y1="38.5" x2="110" y2="38.5"/>
    <line x1="18" y1="53.5" x2="110" y2="53.5"/>
    <line x1="18" y1="67.5" x2="110" y2="67.5"/>
    <line x1="41.5" y1="24" x2="41.5" y2="82"/>
    <line x1="64.5" y1="24" x2="64.5" y2="82"/>
    <line x1="87.5" y1="24" x2="87.5" y2="82"/>
  </g>
  <path d="M18 70 L28 66 L36 72 L46 50 L54 58 L64 34 L72 46 L82 42 L92 60 L102 52 L110 56 L110 82 L18 82 Z" fill="url(#area)"/>
  <path d="M18 70 L28 66 L36 72 L46 50 L54 58 L64 34 L72 46 L82 42 L92 60 L102 52 L110 56" fill="none" stroke="#f08a3e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g>
    <rect x="18" y="92" width="26" height="10" rx="3" fill="#4a4a50"/>
    <rect x="18" y="92" width="18" height="10" rx="3" fill="#f08a3e"/>
    <rect x="51" y="92" width="26" height="10" rx="3" fill="#4a4a50"/>
    <rect x="51" y="92" width="10" height="10" rx="3" fill="#6fae8f"/>
    <rect x="84" y="92" width="26" height="10" rx="3" fill="#4a4a50"/>
    <rect x="84" y="92" width="22" height="10" rx="3" fill="#7fa6c9"/>
  </g>
</svg>
