[package]
name = "patina-bar"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A status bar for dwl in the Patina style: egui drawn on a wlr-layer-shell surface"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
egui = "0.35"
resvg = { version = "0.48.1", default-features = false }
libc = "0.2"
patina-shell = { path = "../shell" }
patina-ui = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1"
