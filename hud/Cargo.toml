[package]
name = "patina-hud"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "The Patina desktop's HUD (what was the bar): launcher, window list, tray and clock: egui drawn on a wlr-layer-shell surface"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
egui = "0.35"
freedesktop-icons = "0.4"
patina-apps = { git = "https://github.com/Sector-F-Labs/patina-apps", features = ["icon"] }
patina-shell = { workspace = true }
patina-system = { path = "../system" }
patina-ui = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
