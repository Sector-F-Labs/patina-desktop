[package]
name = "patina-polkit"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "The Patina desktop's polkit agent: asks for your password when an app needs administrator rights (pkexec, GParted, Disks)"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[dependencies]
async-channel = "2"
egui = "0.35"
libc = "0.2"
patina-shell = { workspace = true }
patina-system = { path = "../system" }
patina-ui = { workspace = true }
zbus = "5"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
