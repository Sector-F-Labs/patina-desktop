<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
<title id="t">Who runs what in a Patina session</title><desc id="d">The login manager runs patina-session, which reads the login profile once and runs patina-compositor with PATINA_SESSION set. The compositor starts and restarts the desktop's own programs. The login manager's signals are passed on to the compositor, and a marker file in the runtime directory remembers the lock across restarts.</desc>
<style>:root{--bg:#fdf6e3;--group:#f4f0d9;--gstroke:#e0dcc7;--box:#fffbef;--bstroke:#a6b0a0;--text:#5c6a72;--muted:#708089;--blue:#3a94c5;--green:#8da101;--purple:#df69ba;--tblue:#2d7fa8;--tgreen:#677800;--tpurple:#b54f93;--busfill:#f3ecc2;--busstroke:#dfa000;--red:#f85552;--line:#829181;--note:#e4efe9;}@media (prefers-color-scheme: dark){:root{--bg:#2d353b;--group:#343f44;--gstroke:#475258;--box:#2d353b;--bstroke:#7a8478;--text:#d3c6aa;--muted:#9da9a0;--blue:#7fbbb3;--green:#a7c080;--purple:#d699b6;--tblue:#7fbbb3;--tgreen:#a7c080;--tpurple:#d699b6;--busfill:#4d4c43;--busstroke:#dbbc7f;--red:#e67e80;--line:#859289;--note:#384b55;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--text)}
.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mu{fill:var(--muted);font-size:12px}.s{font-size:11.5px}.e{text-anchor:end}.c{text-anchor:middle}
.h{font-size:14px;font-weight:600}
.bg{fill:var(--bg)}
.grp{fill:var(--group);stroke:var(--gstroke);stroke-width:1.2}
.box{fill:var(--box);stroke:var(--bstroke);stroke-width:1.2}
.bl{stroke:var(--blue);stroke-width:1.6}.gr{stroke:var(--green);stroke-width:1.6}.pu{stroke:var(--purple);stroke-width:1.6}
.tb{fill:var(--tblue)}.tg{fill:var(--tgreen)}.tp{fill:var(--tpurple)}
.bus{fill:var(--busfill);stroke:var(--busstroke);stroke-width:1.4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.dash{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.ah{fill:var(--line)}
.note{fill:var(--note);stroke:var(--blue);stroke-width:1}
.red{fill:var(--red)}.bar{fill:var(--purple)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" width="960" height="620" rx="10"/>

<rect x="40" y="30" width="420" height="70" rx="8" class="box"/>
<text x="250" y="58" class="b c">the login manager (GDM)</text>
<text x="250" y="78" class="s c mu">Exec=patina-session --session, from patina.desktop</text>
<line x1="250" y1="100" x2="250" y2="139" class="ln" marker-end="url(#a)"/>

<rect x="40" y="140" width="420" height="180" rx="12" class="grp"/>
<text x="56" y="164" class="h tg">patina-session</text>
<text x="444" y="164" class="s mu e">no dependency on the rest of the desktop</text>
<rect x="56" y="180" width="388" height="52" rx="8" class="box gr"/>
<text x="250" y="203" class="b c">1. read the login profile, once</text>
<text x="250" y="221" class="s c mu">sh -l -c 'exec env -0', given 5 seconds</text>
<rect x="56" y="250" width="388" height="52" rx="8" class="box gr"/>
<text x="250" y="273" class="b c">2. run the compositor, and wait for it</text>
<text x="250" y="291" class="s c mu">again if it restarts or crashes; see the second picture</text>
<line x1="250" y1="232" x2="250" y2="249" class="ln" marker-end="url(#a)"/>
<line x1="250" y1="320" x2="250" y2="379" class="ln" marker-end="url(#a)"/>
<text x="262" y="354" class="s">PATINA_SESSION = its process ID, and the profile's environment</text>

<rect x="40" y="380" width="420" height="70" rx="8" class="box bl"/>
<text x="250" y="408" class="b c">patina-compositor</text>
<text x="250" y="428" class="s c mu">owns the screen, the keys, the focus and every window</text>
<line x1="250" y1="450" x2="250" y2="479" class="ln" marker-end="url(#a)"/>
<text x="262" y="470" class="s">starts them, and starts them again</text>

<rect x="40" y="480" width="420" height="110" rx="12" class="grp"/>
<text x="56" y="504" class="h">the desktop's own programs, and your apps</text>
<rect x="56" y="520" width="88" height="40" rx="8" class="box"/><text x="100" y="545" class="s c">wallpaper</text>
<rect x="154" y="520" width="88" height="40" rx="8" class="box"/><text x="198" y="545" class="s c">bar</text>
<rect x="252" y="520" width="88" height="40" rx="8" class="box"/><text x="296" y="545" class="s c">tiler</text>
<rect x="350" y="520" width="94" height="40" rx="8" class="box"/><text x="397" y="545" class="s c">dictate</text>
<text x="250" y="580" class="s c mu">they don't inherit PATINA_SESSION</text>

<rect x="520" y="30" width="400" height="70" rx="8" class="bus"/>
<text x="720" y="58" class="b c">SIGTERM · SIGHUP · SIGINT</text>
<text x="720" y="78" class="s c mu">passed on to the compositor; the session then ends</text>
<line x1="461" y1="65" x2="519" y2="65" class="ln" marker-end="url(#a)"/>

<rect x="520" y="180" width="400" height="70" rx="8" class="box"/>
<text x="720" y="206" class="b c">/etc/profile, then ~/.profile</text>
<text x="720" y="226" class="s c mu">PATH with ~/.local/bin, EDITOR, and the rest</text>
<line x1="444" y1="206" x2="519" y2="206" class="ln" marker-end="url(#a)"/>

<rect x="520" y="365" width="400" height="100" rx="8" class="bus"/>
<text x="720" y="391" class="b c">patina-session-&lt;id&gt;.locked</text>
<text x="720" y="410" class="s c mu">in $XDG_RUNTIME_DIR; kept while the screen is locked,</text>
<text x="720" y="427" class="s c mu">so a restarted compositor starts locked;</text>
<text x="720" y="444" class="s c mu">the session removes it when it ends</text>
<path d="M461,415 H519" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
