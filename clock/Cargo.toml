[package]
name = "patina-clock"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "The Patina desktop's clock menu: a month, and the day's events from Calendar"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
egui = "0.35"
patina-shell = { workspace = true }
patina-system = { path = "../system" }
patina-ui = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
