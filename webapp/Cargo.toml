[package]
name = "patina-webapp"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "The Patina desktop's web apps: a URL installed as an app, launched in its own chromeless window"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[lib]
name = "patina_webapp"

[[bin]]
name = "patina-webapp"
path = "src/main.rs"

[dependencies]
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
