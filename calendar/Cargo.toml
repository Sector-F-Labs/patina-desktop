[package]
name = "calendar"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dirs = "7"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["datepicker", "serde"] }
iana-time-zone = "0.1.65"
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
patina-ui = "0.1.1"
roxmltree = "0.21.1"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1"
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
resvg = "0.48.1"
