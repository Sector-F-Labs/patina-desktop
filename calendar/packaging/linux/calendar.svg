<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- A desk calendar page: an orange header held by two rings, and a grid
       of days with today picked out in the same orange. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#ebe8e1"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2683a"/>
      <stop offset="1" stop-color="#d9481a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b5b60"/>
      <stop offset="0.5" stop-color="#c8c8cc"/>
      <stop offset="1" stop-color="#5b5b60"/>
    </linearGradient>
    <clipPath id="pageclip"><rect x="16" y="20" width="96" height="96" rx="14"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect x="18" y="24" width="96" height="96" rx="14" fill="#000" opacity="0.3" filter="url(#shadow)"/>
  <rect x="16" y="20" width="96" height="96" rx="14" fill="url(#page)"/>
  <g clip-path="url(#pageclip)">
    <rect x="16" y="20" width="96" height="27" fill="url(#band)"/>
    <rect x="16" y="46" width="96" height="1.2" fill="#000" opacity="0.15"/>
  </g>
  <!-- holes and rings -->
  <circle cx="44" cy="30" r="3.4" fill="#7a2a10" opacity="0.55"/>
  <circle cx="84" cy="30" r="3.4" fill="#7a2a10" opacity="0.55"/>
  <rect x="41.5" y="11" width="5" height="21" rx="2.5" fill="url(#ring)"/>
  <rect x="81.5" y="11" width="5" height="21" rx="2.5" fill="url(#ring)"/>

  <g>
    <rect x="47.9" y="56.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="59.5" y="56.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="71.1" y="56.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="82.7" y="56.0" width="9" height="8" rx="2" fill="#c9c6c0"/>
    <rect x="94.3" y="56.0" width="9" height="8" rx="2" fill="#c9c6c0"/>
    <rect x="24.7" y="67.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="36.3" y="67.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="47.9" y="67.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="59.5" y="67.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="71.1" y="67.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="82.7" y="67.0" width="9" height="8" rx="2" fill="#c9c6c0"/>
    <rect x="94.3" y="67.0" width="9" height="8" rx="2" fill="#c9c6c0"/>
    <rect x="24.7" y="78.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="36.3" y="78.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="47.9" y="78.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="59.5" y="78.0" width="9" height="8" rx="2" fill="#e95420"/>
    <rect x="71.1" y="78.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="82.7" y="78.0" width="9" height="8" rx="2" fill="#c9c6c0"/>
    <rect x="94.3" y="78.0" width="9" height="8" rx="2" fill="#c9c6c0"/>
    <rect x="24.7" y="89.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="36.3" y="89.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="47.9" y="89.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="59.5" y="89.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="71.1" y="89.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="82.7" y="89.0" width="9" height="8" rx="2" fill="#c9c6c0"/>
    <rect x="94.3" y="89.0" width="9" height="8" rx="2" fill="#c9c6c0"/>
    <rect x="24.7" y="100.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="36.3" y="100.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="47.9" y="100.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="59.5" y="100.0" width="9" height="8" rx="2" fill="#8f8b84"/>
    <rect x="71.1" y="100.0" width="9" height="8" rx="2" fill="#8f8b84"/>
  </g>
  <rect x="16.4" y="20.4" width="95.2" height="95.2" rx="13.6" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="0.8"/>
</svg>
