<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- A film clapperboard: a dark slate with chalk lines, and its striped
       clapper lifted open on a hinge, as at the start of a take. -->
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#23272d"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40454e"/>
      <stop offset="1" stop-color="#2a2e35"/>
    </linearGradient>
    <clipPath id="clapper">
      <rect x="0" y="0" width="98" height="18" rx="3"/>
    </clipPath>
    <clipPath id="band">
      <rect x="14" y="44" width="100" height="16"/>
    </clipPath>
  </defs>

  <!-- Shadow. -->
  <rect x="15" y="47" width="100" height="70" rx="8" fill="#000" opacity="0.18"/>

  <!-- The slate. -->
  <rect x="14" y="44" width="100" height="70" rx="8" fill="url(#slate)"/>
  <!-- Its striped top band. -->
  <g clip-path="url(#band)">
    <rect x="14" y="44" width="100" height="16" fill="#f4f1ea"/>
    <g fill="#2a2e35">
      <polygon points="14,44 28,44 40,60 26,60"/>
      <polygon points="42,44 56,44 68,60 54,60"/>
      <polygon points="70,44 84,44 96,60 82,60"/>
      <polygon points="98,44 112,44 124,60 110,60"/>
    </g>
  </g>
  <!-- Chalk lines. -->
  <g stroke="#e9e6df" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="24" y1="76" x2="104" y2="76"/>
    <line x1="24" y1="92" x2="104" y2="92"/>
  </g>
  <g fill="#e9e6df" opacity="0.55">
    <rect x="28" y="82" width="26" height="4" rx="2"/>
    <rect x="70" y="82" width="20" height="4" rx="2"/>
    <rect x="28" y="98" width="18" height="4" rx="2"/>
    <rect x="70" y="98" width="28" height="4" rx="2"/>
  </g>

  <!-- The clapper, opened about its hinge at the left. -->
  <g transform="translate(14 40) rotate(-18)">
    <rect x="0" y="-18" width="98" height="18" rx="3" fill="url(#arm)"/>
    <g transform="translate(0 -18)" clip-path="url(#clapper)">
      <rect x="0" y="0" width="98" height="18" fill="#f4f1ea"/>
      <g fill="#2a2e35">
        <polygon points="8,0 22,0 10,18 -4,18"/>
        <polygon points="36,0 50,0 38,18 24,18"/>
        <polygon points="64,0 78,0 66,18 52,18"/>
        <polygon points="92,0 106,0 94,18 80,18"/>
      </g>
    </g>
  </g>
  <!-- The hinge. -->
  <circle cx="16" cy="41" r="5" fill="#c9c4b8"/>
  <circle cx="16" cy="41" r="2" fill="#6b6f77"/>
</svg>
