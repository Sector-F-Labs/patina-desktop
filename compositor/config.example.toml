# Patina compositor settings.
#
# Everything here is commented out at its default, so this file changes
# nothing until you edit it. Uncomment a line to change it and save: it
# applies within a second, or at once with Super+Shift+R. Mistakes are
# reported in the session's log (journalctl -b | grep patina) and never stop
# the desktop.

# The screen's scale. Unset, it's chosen from the panel's density: 1.5 on most
# laptops, 1 on desktop monitors, 2 on very dense panels. PATINA_SCALE in the
# environment overrides it.
# scale = 1.5

# What tapping Super on its own, or Super+Space, opens; "" for nothing.
# launcher = "patina-launcher"

# What a right click on the desktop opens, at the pointer: the desktop's menu,
# where the shell's skin is chosen; "" for nothing.
# desktop_menu = "patina-menu"

[keyboard]
# Layouts to switch between with Ctrl+Space, four at most (xkb leaves out
# any after the fourth). Unset, the system's from
# /etc/default/keyboard.
# layout = "us,se"
# variant = ""
# model = ""
# options = ""

# Milliseconds before a held key repeats, and repeats per second.
# repeat_delay = 200
# repeat_rate = 25

# What Caps Lock does: "caps_lock", "escape", "ctrl", or "swap_escape"
# (Escape, and Escape becomes Caps Lock). Added to the options above.
# caps_lock = "caps_lock"

[touchpad]
# Tap to click.
# tap = true

# Content follows your fingers, as on a phone. false scrolls the other way.
# natural_scroll = true

# Pointer speed, from -1.0 (slowest) to 1.0 (fastest).
# speed = 0.0

# Drag with three fingers, as macOS's accessibility setting has it: three
# fingers moving hold the button down and move the pointer. Lift, and put
# them back within half a second to carry on the drag; moving on with one
# finger drops it at once.
# three_finger_drag = true

[cursor]
# An installed cursor theme (a folder in /usr/share/icons, such as "Yaru"
# or "Adwaita") to use instead of Patina's own; "" for Patina's.
# theme = ""

# The cursor's size in pixels at scale 1; it's scaled with the screen.
# size = 24

[media]
# Percent of the screen's brightness range per press of a brightness key.
# Brightness is set through the login session, so it needs no extra tools.
# brightness_step = 5

# What the volume and microphone keys run, through sh. The defaults are for
# PipeWire (Ubuntu's sound system); "" does nothing.
# volume_up = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
# volume_down = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
# mute = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
# mic_mute = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"

# The menu that flashes up with the level after a volume key; "" for none.
# volume_menu = "patina-volume"

[lock]
# The lock screen: any locker that speaks ext-session-lock. Ctrl+Super+Q (as
# Ctrl+Cmd+Q on a Mac) and Super+Escape run it, and so does going to sleep.
# The default is Patina's own, in the bar's skin; "swaylock -f -c 1b1b1b"
# also works; "" for no lock screen.
# command = "patina-lock"

# Lock before the machine sleeps (closing the lid, or a suspend), so the
# desktop isn't shown on waking.
# on_suspend = true

# Lock when the screen turns off for want of input ([screen] off_after), as
# GNOME does.
# on_screen_off = true

[screen]
# Turn the screen off after this many seconds without the keyboard, pointer
# or touchpad being used; 0 for never. Any input turns it back on. Videos,
# and games through Steam, hold it on while they play. Settings' Power page
# changes this for you.
# off_after = 300

[night_light]
# Warm the screen in the evening, on the hardware (not when nested in another
# desktop, which has its own). Settings changes these for you.
#   "off", "always", or "schedule" (from `from` to `to` every day).
# mode = "off"
# from = "20:00"
# to = "06:00"

# How warm, in kelvin: 6500 is neutral, 1700 the warmest.
# temperature = 4000

[gaps]
# Space around tiled and maximised windows, and between them, as tiling
# window managers have. The bar floats off the screen's edge by the same
# gap, with rounded corners. Settings' Appearance page changes these.
# enabled = false
# size = 8

# The floating bar's corner radius, in pixels.
# radius = 8

[keys]
# The desktop's own keys, by action, applied within a second of a save. Each
# action set here replaces its defaults, the others keep theirs; "" or []
# takes its keys away, and a Super key nothing has goes to the app as Ctrl
# (Super+L is Ctrl+L). Keys are written as for [bindings]; "Super" alone is
# Super tapped on its own. Ctrl+Alt+Backspace, Ctrl+Alt+Shift+Backspace, the
# consoles and the media keys are fixed.
# launcher = ["Super", "Super+Space"]
# next_layout = "Ctrl+Space"
# next_tab = "Alt+Tab"
# previous_tab = "Alt+Shift+Tab"
# quit_app = "Super+Q"
# lock = ["Super+Escape", "Ctrl+Super+Q"]
# reload = "Super+Shift+R"
# screenshot = ["Super+Shift+3", "Print"]
# screenshot_window = "Super+Shift+4"
# snap_up = ["Super+Up", "Ctrl+Super+K"]
# snap_down = ["Super+Down", "Ctrl+Super+J"]
# snap_left = ["Super+Left", "Ctrl+Super+H"]
# snap_right = ["Super+Right", "Ctrl+Super+L"]
# grow_up = "Super+Shift+Up"
# grow_down = "Super+Shift+Down"
# grow_left = "Super+Shift+Left"
# grow_right = "Super+Shift+Right"
# resize_grow = "Ctrl+Super+Shift+K"
# resize_shrink = "Ctrl+Super+Shift+J"
# resize_wider = "Ctrl+Super+Shift+L"
# resize_narrower = "Ctrl+Super+Shift+H"
# window_1 = "Super+1"            # and so on to window_9, the bar's tabs

# Keys that run commands: modifiers (Super, Alt, Ctrl, Shift) and a key, by
# its name ("T", "Return", "F5"). Writing a [bindings] section replaces these
# defaults, so uncomment the header together with the bindings you keep.
# patina-raise focuses the app's window, or starts the app if none is open.
# [bindings]
# "Alt+T" = "teleprinter"
# "Alt+B" = "patina-raise firefox"
