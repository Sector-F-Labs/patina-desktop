[package]
name = "patina-compositor"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A floating Wayland compositor for the Patina desktop, built on Smithay"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman", "backend_winit", "backend_drm", "backend_gbm", "backend_udev", "backend_libinput", "backend_session_libseat"] }
xcursor = "0.3"
resvg = { version = "0.48.1", default-features = false }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1"
zbus = "5"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
