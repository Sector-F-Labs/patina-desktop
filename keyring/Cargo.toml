[package]
name = "patina-keyring"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "The Patina desktop's keyring prompter: asks for the keyring's password when logging in couldn't unlock it"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[dependencies]
egui = "0.35"
libc = "0.2"
patina-shell = { workspace = true }
patina-ui = { workspace = true }
zbus = "5"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.12"
num-bigint = "0.4"
sha2 = "0.10"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
