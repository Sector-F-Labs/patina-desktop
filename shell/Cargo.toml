[package]
name = "patina-shell"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Desktop pieces in egui: wlr-layer-shell surfaces (or a window where there's none) drawn in software, for the Patina desktop's bar, launcher and menus"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[lib]
name = "patina_shell"

[dependencies]
egui = "0.35"
patina-ui = { workspace = true }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }

