# bsdt environment; see bsdt(1).
#
# A FreeBSD VM whose desktop is dwl from packages, used only as somewhere
# for patina-compositor's window to open. The compositor fills the screen
# (dwl tiles its only window) and runs patina-bar inside it.
#
#   make vm            # create, build, start dwl and the compositor
#   make vm-gui        # open the desktop in a VNC viewer
#   make vm-restart    # rebuild and restart after changes

[vm]
os = "freebsd"
version = "15.1"
# arch = "auto"         # auto (match the host), amd64 or aarch64
cpus = 4
memory = "4G"
# disk = "20G"
# filesystem = "ufs"    # ufs or zfs
# ports = ["8080:80"]   # 127.0.0.1:HOST on the host -> GUEST in the VM
# update = false        # install OS security updates on first boot
audio = true         # a sound card that plays on the host
gui = true           # a desktop in a window; see [gui] in bsdt(1)

[packages]
# foot and wmenu are dwl's default terminal and launcher; grim takes
# screenshots of the desktop for checking the bar; xdotool drives X windows
# (minimising one, as Wine does) for checking the window manager.
# libxkbcommon, pixman and pkgconf are for building the compositor;
# alsa-lib for building UnAmp, and alsa-plugins to reach the sound card
# through FreeBSD's OSS.
install = ["git", "rust", "pkgconf", "libxkbcommon", "pixman", "alsa-lib", "alsa-plugins",
           "dwl", "foot", "wmenu", "wofi", "grim", "fastfetch", "firefox", "xwayland", "xterm",
           "xdotool"]

[sync]
# dest = "/home/bsdt/<project directory>"
exclude = ["target"]

[provision]
# UnAmp comes from crates.io, with a launcher entry so wofi lists it.
# The launcher comes from its own repository (ADR-0037), and goes beside the
# compositor, which puts its own folder first on its clients' PATH.
run = ["cargo build --release",
       "cargo install --locked --git https://github.com/Sector-F-Labs/patina-launcher --root /tmp/patina-launcher patina-launcher && cp /tmp/patina-launcher/bin/patina-launcher target/release/",
       "cargo install --locked unamp",
       "mkdir -p $HOME/.local/share/applications && printf '[Desktop Entry]\\nType=Application\\nName=UnAmp\\nComment=Music player\\nExec=%s/.cargo/bin/unamp\\nCategories=AudioVideo;Audio;Player;\\n' $HOME > $HOME/.local/share/applications/unamp.desktop"]

[gui]
desktop = "wayland"
session = "dwl"
# Under a session bus of its own, which the pieces share: Settings reaches
# the compositor on it (ADR-0045). Through patina-session, as at login, so
# the desktop can restart (ADR-0046).
start = "exec dbus-run-session -- target/release/patina-session"
open = false
