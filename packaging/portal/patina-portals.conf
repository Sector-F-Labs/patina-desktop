# Which xdg-desktop-portal backends the Patina desktop
# (XDG_CURRENT_DESKTOP=Patina) uses. Installed in /etc/xdg, which comes
# before the copy Files puts in /usr/share, so it keeps Files' line.
#
# Screen sharing and recording by apps (OBS, browsers) go to
# xdg-desktop-portal-wlr, which captures through the compositor's
# ext-image-copy-capture (ADR-0092); files to Files' chooser if it's
# installed; the rest to GTK's.
[preferred]
default=gtk;
org.freedesktop.impl.portal.FileChooser=patina;gtk;
org.freedesktop.impl.portal.ScreenCast=wlr;
