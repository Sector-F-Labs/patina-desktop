<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="t d">
<title id="t">One emoji, in time</title><desc id="d">From the key to the emoji appearing: the compositor starts the picker, you search and choose, the picker closes and calls Commit, and the compositor types the emoji into the focused window through the clipboard.</desc>
<style>:root{--bg:#fdf6e3;--group:#f4f0d9;--gstroke:#e0dcc7;--box:#fffbef;--bstroke:#a6b0a0;--text:#5c6a72;--muted:#708089;--blue:#3a94c5;--green:#8da101;--purple:#df69ba;--tblue:#2d7fa8;--tgreen:#677800;--tpurple:#b54f93;--busfill:#f3ecc2;--busstroke:#dfa000;--red:#f85552;--line:#829181;--note:#e4efe9;}@media (prefers-color-scheme: dark){:root{--bg:#2d353b;--group:#343f44;--gstroke:#475258;--box:#2d353b;--bstroke:#7a8478;--text:#d3c6aa;--muted:#9da9a0;--blue:#7fbbb3;--green:#a7c080;--purple:#d699b6;--tblue:#7fbbb3;--tgreen:#a7c080;--tpurple:#d699b6;--busfill:#4d4c43;--busstroke:#dbbc7f;--red:#e67e80;--line:#859289;--note:#384b55;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--text)}
.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mu{fill:var(--muted);font-size:12px}.s{font-size:11.5px}.e{text-anchor:end}.c{text-anchor:middle}
.h{font-size:14px;font-weight:600}
.bg{fill:var(--bg)}
.grp{fill:var(--group);stroke:var(--gstroke);stroke-width:1.2}
.box{fill:var(--box);stroke:var(--bstroke);stroke-width:1.2}
.bl{stroke:var(--blue);stroke-width:1.6}.gr{stroke:var(--green);stroke-width:1.6}.pu{stroke:var(--purple);stroke-width:1.6}
.tb{fill:var(--tblue)}.tg{fill:var(--tgreen)}.tp{fill:var(--tpurple)}
.bus{fill:var(--busfill);stroke:var(--busstroke);stroke-width:1.4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.dash{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.ah{fill:var(--line)}
.note{fill:var(--note);stroke:var(--blue);stroke-width:1}
.red{fill:var(--red)}.bar{fill:var(--purple)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" width="960" height="570" rx="10"/>
<rect x="44" y="20" width="132" height="40" rx="8" class="box "/>
<text x="110" y="45" class="b c">You</text>
<line x1="110" y1="60" x2="110" y2="550" class="dash"/>
<rect x="264" y="20" width="132" height="40" rx="8" class="box bl"/>
<text x="330" y="45" class="b c">Compositor</text>
<line x1="330" y1="60" x2="330" y2="550" class="dash"/>
<rect x="514" y="20" width="132" height="40" rx="8" class="box gr"/>
<text x="580" y="45" class="b c">Emoji picker</text>
<line x1="580" y1="60" x2="580" y2="550" class="dash"/>
<rect x="784" y="20" width="132" height="40" rx="8" class="box "/>
<text x="850" y="45" class="b c">Focused window</text>
<line x1="850" y1="60" x2="850" y2="550" class="dash"/>
<line x1="110" y1="100" x2="329" y2="100" class="ln" marker-end="url(#a)"/>
<text x="220.0" y="93" class="s c">Ctrl+Super+Space, or Super+period</text>
<line x1="330" y1="140" x2="579" y2="140" class="ln" marker-end="url(#a)"/>
<text x="455.0" y="133" class="s c">starts patina-emoji</text>
<rect x="430.0" y="164" width="300" height="28" rx="6" class="note"/>
<text x="580" y="182" class="s c">a layer-shell overlay, centred, with the keyboard</text>
<line x1="110" y1="220" x2="579" y2="220" class="ln" marker-end="url(#a)"/>
<text x="345.0" y="213" class="s c">type to search, arrows, or a category</text>
<line x1="110" y1="260" x2="579" y2="260" class="ln" marker-end="url(#a)"/>
<text x="345.0" y="253" class="s c">Enter, or a click on one</text>
<rect x="455.0" y="284" width="250" height="28" rx="6" class="note"/>
<text x="580" y="302" class="s c">remembers it in recent, closes</text>
<rect x="435.0" y="324" width="290" height="28" rx="6" class="note"/>
<text x="580" y="342" class="s c">waits 120 ms for the focus to come back</text>
<line x1="580" y1="380" x2="331" y2="380" class="ln" marker-end="url(#a)"/>
<text x="455.0" y="373" class="s c">Commit(emoji)</text>
<rect x="185.0" y="404" width="290" height="28" rx="6" class="note"/>
<text x="330" y="422" class="s c">saves the clipboard, serves the emoji</text>
<line x1="330" y1="460" x2="849" y2="460" class="ln" marker-end="url(#a)"/>
<text x="590.0" y="453" class="s c">Ctrl+V (Ctrl+Shift+V in a terminal)</text>
<line x1="850" y1="500" x2="331" y2="500" class="ln" marker-end="url(#a)"/>
<text x="590.0" y="493" class="s c">reads the clipboard</text>
<rect x="230.0" y="524" width="200" height="28" rx="6" class="note"/>
<text x="330" y="542" class="s c">gives the clipboard back</text>
</svg>
