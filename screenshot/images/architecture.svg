<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 810" width="960" height="810" role="img" aria-labelledby="t d">
<title id="t">How screenshots and recordings fit in</title><desc id="d">The compositor sees the Print key and either takes the screen at once or starts patina-screenshot, which prints the choice. Screen, window and selection are drawn offscreen by the compositor, flashed and saved as a PNG on a thread; recording feeds frames to ffmpeg. A separate path lets other programs share the screen through the portal, which asks the compositor for frames and patina-screenshot for the choice.</desc>
<style>:root{--bg:#fdf6e3;--group:#f4f0d9;--gstroke:#e0dcc7;--box:#fffbef;--bstroke:#a6b0a0;--text:#5c6a72;--muted:#708089;--blue:#3a94c5;--green:#8da101;--purple:#df69ba;--tblue:#2d7fa8;--tgreen:#677800;--tpurple:#b54f93;--busfill:#f3ecc2;--busstroke:#dfa000;--red:#f85552;--line:#829181;--note:#e4efe9;}@media (prefers-color-scheme: dark){:root{--bg:#2d353b;--group:#343f44;--gstroke:#475258;--box:#2d353b;--bstroke:#7a8478;--text:#d3c6aa;--muted:#9da9a0;--blue:#7fbbb3;--green:#a7c080;--purple:#d699b6;--tblue:#7fbbb3;--tgreen:#a7c080;--tpurple:#d699b6;--busfill:#4d4c43;--busstroke:#dbbc7f;--red:#e67e80;--line:#859289;--note:#384b55;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--text)}
.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mu{fill:var(--muted);font-size:12px}.s{font-size:11.5px}.e{text-anchor:end}.c{text-anchor:middle}
.h{font-size:14px;font-weight:600}
.bg{fill:var(--bg)}
.grp{fill:var(--group);stroke:var(--gstroke);stroke-width:1.2}
.box{fill:var(--box);stroke:var(--bstroke);stroke-width:1.2}
.bl{stroke:var(--blue);stroke-width:1.6}.gr{stroke:var(--green);stroke-width:1.6}.pu{stroke:var(--purple);stroke-width:1.6}
.tb{fill:var(--tblue)}.tg{fill:var(--tgreen)}.tp{fill:var(--tpurple)}
.bus{fill:var(--busfill);stroke:var(--busstroke);stroke-width:1.4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.dash{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.ah{fill:var(--line)}
.note{fill:var(--note);stroke:var(--blue);stroke-width:1}
.red{fill:var(--red)}.bar{fill:var(--purple)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" width="960" height="810" rx="10"/>

<rect x="30" y="30" width="590" height="540" rx="12" class="grp"/>
<text x="46" y="54" class="h tb">patina-compositor</text>
<text x="604" y="54" class="mu e s">the only process that can draw the desktop or see the keys</text>

<rect x="64" y="84" width="512" height="56" rx="8" class="box bl"/>
<text x="320" y="107" class="b c">input.rs: the screenshot keys</text>
<text x="320" y="126" class="s c mu">Print · Super+Shift+3 · 4 · 5, kept even over a fullscreen game</text>

<rect x="64" y="180" width="210" height="70" rx="8" class="box bl"/>
<text x="169" y="206" class="b c">menu.rs</text>
<text x="169" y="226" class="s c mu">starts the pill, reads its choice</text>
<rect x="64" y="290" width="210" height="70" rx="8" class="box bl"/>
<text x="169" y="316" class="b c">select.rs</text>
<text x="169" y="336" class="s c mu">dim, crosshair, drag a rectangle</text>
<rect x="64" y="400" width="210" height="70" rx="8" class="box bl"/>
<text x="169" y="426" class="b c">capture/record.rs</text>
<text x="169" y="446" class="s c mu">a frame, up to 30 a second</text>

<rect x="384" y="180" width="192" height="70" rx="8" class="box bl"/>
<text x="480" y="206" class="b c">take_screenshot</text>
<text x="480" y="226" class="s c mu">the desktop, a window, an area</text>
<rect x="384" y="290" width="192" height="70" rx="8" class="box bl"/>
<text x="480" y="316" class="b c">draw offscreen</text>
<text x="480" y="336" class="s c mu">same renderer, no pointer</text>
<rect x="384" y="400" width="192" height="70" rx="8" class="box bl"/>
<text x="480" y="426" class="b c">flash, then save</text>
<text x="480" y="446" class="s c mu">a thread writes the PNG</text>

<line x1="130" y1="140" x2="130" y2="179" class="ln" marker-end="url(#a)"/>
<text x="138" y="162" class="s">Print, Super+Shift+5</text>
<line x1="480" y1="140" x2="480" y2="179" class="ln" marker-end="url(#a)"/>
<text x="472" y="162" class="s e">Super+Shift+3 / 4; Print, fullscreen</text>
<line x1="274" y1="215" x2="383" y2="215" class="ln" marker-end="url(#a)"/>
<text x="329" y="208" class="s c">Screen, Window</text>
<line x1="169" y1="250" x2="169" y2="289" class="ln" marker-end="url(#a)"/>
<text x="177" y="274" class="s">Selection, Record Selection</text>
<line x1="274" y1="325" x2="383" y2="325" class="ln" marker-end="url(#a)"/>
<text x="329" y="318" class="s c">the area</text>
<line x1="169" y1="360" x2="169" y2="399" class="ln" marker-end="url(#a)"/>
<text x="177" y="384" class="s">Record Selection</text>
<path d="M64,215 H46 V435 H63" class="ln" marker-end="url(#a)"/>
<text transform="rotate(-90 57 330)" x="57" y="330" class="s c mu">Record Screen</text>
<line x1="480" y1="250" x2="480" y2="289" class="ln" marker-end="url(#a)"/>
<line x1="480" y1="360" x2="480" y2="399" class="ln" marker-end="url(#a)"/>

<path d="M250,180 V170 H659" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="488" y="162" class="s">spawn, read choice</text>

<rect x="660" y="30" width="260" height="240" rx="12" class="grp"/>
<text x="676" y="54" class="h tg">patina-screenshot</text>
<text x="676" y="76" class="s mu">egui on layer-shell, in the bar's skin;</text>
<text x="676" y="92" class="s mu">takes nothing and records nothing</text>
<rect x="676" y="130" width="228" height="60" rx="8" class="box gr"/>
<text x="790" y="155" class="b c">the choices</text>
<text x="790" y="174" class="s c mu">Screen · Window · Selection · Record</text>
<rect x="676" y="204" width="228" height="50" rx="8" class="box gr"/>
<text x="790" y="226" class="b c">--recording</text>
<text x="790" y="243" class="s c mu">red dot, time, Stop</text>

<rect x="660" y="345" width="260" height="225" rx="12" class="grp"/>
<text x="676" y="368" class="h">On disk</text>
<rect x="676" y="400" width="228" height="70" rx="8" class="box"/>
<text x="790" y="426" class="b c">~/Pictures/Screenshots</text>
<text x="790" y="446" class="s c mu">Screenshot 2026-11-03 at 21.04.33.png</text>
<rect x="676" y="490" width="228" height="60" rx="8" class="box"/>
<text x="790" y="514" class="b c">ffmpeg, then the MP4</text>
<text x="790" y="532" class="s c mu">~/Videos/Screen Recordings</text>
<line x1="576" y1="435" x2="675" y2="435" class="ln" marker-end="url(#a)"/>
<path d="M169,470 V520 H675" class="ln" marker-end="url(#a)"/>
<text x="420" y="513" class="s c">frames on ffmpeg's stdin</text>

<rect x="30" y="610" width="890" height="180" rx="12" class="grp"/>
<text x="46" y="634" class="h">Sharing the screen with another program</text>
<text x="904" y="634" class="mu e s">not the Print key: OBS, a browser's "share screen"</text>
<rect x="54" y="685" width="170" height="56" rx="8" class="box"/>
<text x="139" y="709" class="b c">OBS, a browser</text>
<text x="139" y="727" class="s c mu">asks the portal</text>
<rect x="284" y="685" width="190" height="56" rx="8" class="box"/>
<text x="379" y="709" class="b c">xdg-desktop-portal-wlr</text>
<text x="379" y="727" class="s c mu">streams over PipeWire</text>
<rect x="574" y="652" width="320" height="50" rx="8" class="box gr"/>
<text x="734" y="674" class="b c">patina-screenshot --share</text>
<text x="734" y="691" class="s c mu">lists the screen and windows; prints one</text>
<rect x="574" y="722" width="320" height="50" rx="8" class="box bl"/>
<text x="734" y="744" class="b c">capture.rs</text>
<text x="734" y="761" class="s c mu">ext-image-copy-capture, ext-foreign-toplevel-list</text>
<line x1="224" y1="713" x2="283" y2="713" class="ln" marker-end="url(#a)"/>
<line x1="474" y1="700" x2="573" y2="677" class="ln" marker-end="url(#a)"/>
<text x="500" y="679" class="s mu">which?</text>
<line x1="474" y1="728" x2="573" y2="746" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="500" y="756" class="s mu">frames</text>
</svg>
