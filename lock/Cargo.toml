[package]
name = "patina-lock"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "The Patina desktop's lock screen, an ext-session-lock locker that checks the password through PAM"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui = "0.35"
libc = "0.2"
patina-shell = { workspace = true }
patina-system = { path = "../system" }
patina-ui = { workspace = true }
