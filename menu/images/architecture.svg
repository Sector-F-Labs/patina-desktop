<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
<title id="t">Who opens patina-menu, and what it does</title><desc id="d">The compositor opens patina-menu's desktop menu on a right click on the empty desktop; it sets the style (default, light or dark) through gsettings and opens Settings. The bar opens menus of items for window tabs, tray items and keyboard layouts, and reads the chosen ID from standard output; it also shows tooltips, which end when standard input closes.</desc>
<style>:root{--bg:#fdf6e3;--group:#f4f0d9;--gstroke:#e0dcc7;--box:#fffbef;--bstroke:#a6b0a0;--text:#5c6a72;--muted:#708089;--blue:#3a94c5;--green:#8da101;--purple:#df69ba;--tblue:#2d7fa8;--tgreen:#677800;--tpurple:#b54f93;--busfill:#f3ecc2;--busstroke:#dfa000;--red:#f85552;--line:#829181;--note:#e4efe9;}@media (prefers-color-scheme: dark){:root{--bg:#2d353b;--group:#343f44;--gstroke:#475258;--box:#2d353b;--bstroke:#7a8478;--text:#d3c6aa;--muted:#9da9a0;--blue:#7fbbb3;--green:#a7c080;--purple:#d699b6;--tblue:#7fbbb3;--tgreen:#a7c080;--tpurple:#d699b6;--busfill:#4d4c43;--busstroke:#dbbc7f;--red:#e67e80;--line:#859289;--note:#384b55;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--text)}
.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mu{fill:var(--muted);font-size:12px}.s{font-size:11.5px}.e{text-anchor:end}.c{text-anchor:middle}
.h{font-size:14px;font-weight:600}
.bg{fill:var(--bg)}
.grp{fill:var(--group);stroke:var(--gstroke);stroke-width:1.2}
.box{fill:var(--box);stroke:var(--bstroke);stroke-width:1.2}
.bl{stroke:var(--blue);stroke-width:1.6}.gr{stroke:var(--green);stroke-width:1.6}.pu{stroke:var(--purple);stroke-width:1.6}
.tb{fill:var(--tblue)}.tg{fill:var(--tgreen)}.tp{fill:var(--tpurple)}
.bus{fill:var(--busfill);stroke:var(--busstroke);stroke-width:1.4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.dash{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.ah{fill:var(--line)}
.note{fill:var(--note);stroke:var(--blue);stroke-width:1}
.red{fill:var(--red)}.bar{fill:var(--purple)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" width="960" height="640" rx="10"/>

<rect x="40" y="30" width="260" height="96" rx="8" class="box bl"/>
<text x="170" y="56" class="b c">patina-compositor</text>
<text x="170" y="76" class="s c mu">a right click on the empty desktop</text>
<text x="170" y="94" class="s c mu m">desktop_menu --at X,Y</text>
<text x="170" y="112" class="s c mu">(not with Super held)</text>

<rect x="40" y="156" width="260" height="364" rx="12" class="grp"/>
<text x="56" y="180" class="h tb">patina-bar</text>
<text x="284" y="180" class="s mu e">too thin to hold a menu</text>
<rect x="56" y="196" width="228" height="62" rx="8" class="box bl"/>
<text x="170" y="220" class="b c">a window tab, right click</text>
<text x="170" y="239" class="s c mu">New Window, Pin, Close Window</text>
<rect x="56" y="272" width="228" height="62" rx="8" class="box bl"/>
<text x="170" y="296" class="b c">a tray item, right click</text>
<text x="170" y="315" class="s c mu">its own menu, over D-Bus</text>
<rect x="56" y="348" width="228" height="62" rx="8" class="box bl"/>
<text x="170" y="372" class="b c">the keyboard layout, click</text>
<text x="170" y="391" class="s c mu">the one in use is ticked</text>
<rect x="56" y="424" width="228" height="62" rx="8" class="box bl"/>
<text x="170" y="448" class="b c">hovering for half a second</text>
<text x="170" y="467" class="s c mu">a tab's title, or the tray's status</text>

<rect x="350" y="30" width="260" height="580" rx="12" class="grp"/>
<text x="366" y="54" class="h tg">patina-menu</text>
<text x="594" y="54" class="s mu e">one program, three jobs</text>
<rect x="366" y="76" width="228" height="120" rx="8" class="box gr"/>
<text x="480" y="100" class="b c">the desktop's menu</text>
<text x="480" y="120" class="s c mu">no items given</text>
<text x="480" y="138" class="s c mu">the style, Wallpaper…, copy and</text>
<text x="480" y="155" class="s c mu">open the skins folder, Settings…</text>
<rect x="366" y="226" width="228" height="120" rx="8" class="box gr"/>
<text x="480" y="250" class="b c">a menu of items</text>
<text x="480" y="270" class="s c mu m">--item ID=LABEL, --separator</text>
<text x="480" y="288" class="s c mu">prints the ID chosen, or</text>
<text x="480" y="305" class="s c mu">nothing, and exits</text>
<rect x="366" y="376" width="228" height="120" rx="8" class="box gr"/>
<text x="480" y="400" class="b c">a tooltip</text>
<text x="480" y="420" class="s c mu m">--tooltip TEXT</text>
<text x="480" y="438" class="s c mu">click-through, takes no keys;</text>
<text x="480" y="455" class="s c mu">ends when its stdin closes</text>
<text x="480" y="530" class="s c mu">every job is one transparent surface over</text>
<text x="480" y="547" class="s c mu">the whole screen, wearing the bar's skin</text>
<text x="480" y="584" class="s c mu">see the second picture</text>

<path d="M300,78 H349" class="ln" marker-end="url(#a)"/>
<path d="M284,227 L365,274" class="ln" marker-end="url(#a)"/>
<path d="M284,303 L365,288" class="ln" marker-end="url(#a)"/>
<path d="M284,379 L365,302" class="ln" marker-end="url(#a)"/>
<path d="M284,455 L365,436" class="ln" marker-end="url(#a)"/>

<rect x="660" y="76" width="260" height="76" rx="8" class="bus"/>
<text x="790" y="100" class="b c">GNOME's color-scheme</text>
<text x="790" y="120" class="s c mu">default, light or dark</text>
<text x="790" y="138" class="s c mu">set through gsettings</text>
<rect x="660" y="176" width="260" height="76" rx="8" class="box"/>
<text x="790" y="200" class="b c">patina-settings</text>
<text x="790" y="220" class="s c mu">started by the compositor's Spawn,</text>
<text x="790" y="238" class="s c mu">so it's among the processes</text>
<path d="M594,116 H659" class="ln" marker-end="url(#a)"/>
<path d="M594,166 H628 V214 H659" class="ln" marker-end="url(#a)"/>

<rect x="660" y="272" width="260" height="76" rx="8" class="box"/>
<text x="790" y="296" class="b c">one line on stdout</text>
<text x="790" y="316" class="s c mu">the bar reads it on a thread and</text>
<text x="790" y="334" class="s c mu">acts: a tab, a tray entry, a layout</text>
<path d="M594,310 H659" class="ln" marker-end="url(#a)"/>

<rect x="660" y="376" width="260" height="76" rx="8" class="box"/>
<text x="790" y="400" class="b c">the pipe is the lifetime</text>
<text x="790" y="420" class="s c mu">the bar closes it, or exits: no</text>
<text x="790" y="438" class="s c mu">tooltip outlives its hover</text>
<path d="M660,414 H595" class="ln" marker-end="url(#a)"/>

<rect x="660" y="476" width="260" height="76" rx="8" class="note"/>
<text x="790" y="500" class="s c">the bar and the wallpaper watch the</text>
<text x="790" y="518" class="s c">config and change at once; the launcher,</text>
<text x="790" y="536" class="s c">menus and lock screen read it next time</text>
</svg>
