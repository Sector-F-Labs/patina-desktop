[package]
name = "podcasts"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A Patina podcast player: subscribe to any podcast's RSS feed, play episodes as they download, and pick up where you left off"
repository = "https://github.com/Sector-F-Labs/podcasts"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["file", "image"] }
html2text = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
patina-ui = { workspace = true, features = ["emoji"] }
patina-emoji-font = { workspace = true }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rss = { version = "2.1.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1"
ureq = "3"

[dev-dependencies]
resvg = "0.48"
