<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B5DE5"/>
      <stop offset="1" stop-color="#5B2A9E"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9CED6"/>
      <stop offset="0.45" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#9AA1AC"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E6470"/>
      <stop offset="0.5" stop-color="#A9B0BA"/>
      <stop offset="1" stop-color="#4A4F59"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <!-- sound waves -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.55" stroke-width="5">
    <path d="M30 34 A40 40 0 0 0 30 82"/>
    <path d="M98 34 A40 40 0 0 1 98 82"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.85" stroke-width="5">
    <path d="M40 42 A26 26 0 0 0 40 74"/>
    <path d="M88 42 A26 26 0 0 1 88 74"/>
  </g>
  <!-- stand: yoke, stem and foot -->
  <path d="M46 60 v6 a18 18 0 0 0 36 0 v-6" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
  <rect x="61" y="84" width="6" height="14" fill="url(#metal)"/>
  <rect x="46" y="96" width="36" height="7" rx="3.5" fill="url(#metal)"/>
  <!-- capsule -->
  <rect x="51" y="22" width="26" height="54" rx="13" fill="url(#body)" stroke="#3B3F47" stroke-width="1.5"/>
  <g stroke="#6B717C" stroke-width="1.6" stroke-linecap="round">
    <line x1="55" y1="32" x2="73" y2="32"/>
    <line x1="54" y1="38" x2="74" y2="38"/>
    <line x1="54" y1="44" x2="74" y2="44"/>
    <line x1="54" y1="50" x2="74" y2="50"/>
  </g>
  <rect x="51" y="55" width="26" height="4" fill="#3B3F47"/>
  <circle cx="64" cy="66" r="2.5" fill="#E0453A"/>
</svg>
