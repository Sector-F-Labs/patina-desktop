<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Settings: a warm grey control panel with three slider tracks, one knob
       in Patina orange, and a machined steel gear set over its top right
       corner. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd6c7"/>
      <stop offset="1" stop-color="#b3ab9b"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#4a4a50"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#9e978a"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#c23f12"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9aa2"/>
      <stop offset="0.5" stop-color="#5e5e66"/>
      <stop offset="1" stop-color="#36363c"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset="1" stop-color="#1e1e21"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <!-- shadow under the panel -->
  <ellipse cx="60" cy="116" rx="46" ry="6" fill="#000" opacity="0.3" filter="url(#shadow)"/>

  <!-- the panel -->
  <rect x="14" y="34" width="92" height="78" rx="12" fill="url(#panel)" stroke="#a39b8a" stroke-width="1"/>
  <rect x="14" y="34" width="92" height="6" rx="3" fill="#fff" opacity="0.25"/>

  <!-- three slider tracks with their knobs -->
  <g>
    <rect x="26" y="56" width="68" height="6" rx="3" fill="url(#track)"/>
    <circle cx="44" cy="59" r="7" fill="url(#knob)" stroke="#6e685d" stroke-width="0.8"/>
    <rect x="26" y="76" width="68" height="6" rx="3" fill="url(#track)"/>
    <circle cx="76" cy="79" r="7" fill="url(#orange)" stroke="#8f2e0c" stroke-width="0.8"/>
    <rect x="26" y="96" width="68" height="6" rx="3" fill="url(#track)"/>
    <circle cx="56" cy="99" r="7" fill="url(#knob)" stroke="#6e685d" stroke-width="0.8"/>
  </g>

  <!-- the gear: eight teeth around a ring, over the panel's corner -->
  <g transform="translate(92 34)">
    <circle r="27" fill="#000" opacity="0.25" filter="url(#shadow)" transform="translate(2 3)"/>
    <g fill="url(#steel)" stroke="#2a2a2e" stroke-width="1">
      <path d="M-5 -30 L5 -30 L6.5 -21 L-6.5 -21 Z" transform="rotate(0)"/>
      <path d="M-5 -30 L5 -30 L6.5 -21 L-6.5 -21 Z" transform="rotate(45)"/>
      <path d="M-5 -30 L5 -30 L6.5 -21 L-6.5 -21 Z" transform="rotate(90)"/>
      <path d="M-5 -30 L5 -30 L6.5 -21 L-6.5 -21 Z" transform="rotate(135)"/>
      <path d="M-5 -30 L5 -30 L6.5 -21 L-6.5 -21 Z" transform="rotate(180)"/>
      <path d="M-5 -30 L5 -30 L6.5 -21 L-6.5 -21 Z" transform="rotate(225)"/>
      <path d="M-5 -30 L5 -30 L6.5 -21 L-6.5 -21 Z" transform="rotate(270)"/>
      <path d="M-5 -30 L5 -30 L6.5 -21 L-6.5 -21 Z" transform="rotate(315)"/>
      <circle r="22.5"/>
    </g>
    <!-- a highlight on the ring, and the hub -->
    <path d="M-15 -14 A20 20 0 0 1 14 -15" fill="none" stroke="#fff" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
    <circle r="10" fill="url(#hub)" stroke="#111" stroke-width="1"/>
    <circle r="4" fill="#e95420"/>
  </g>
</svg>
