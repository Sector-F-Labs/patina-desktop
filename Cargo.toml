[workspace]
resolver = "3"
members = ["bar", "compositor", "lock", "menu", "session", "settings", "system", "volume", "wallpaper", "wifi"]

# Patina's develop branch, so desktop work can use Patina changes before
# they're released.
[workspace.dependencies]
patina-ui = { git = "https://github.com/Sector-F-Labs/patina", branch = "develop" }
# The layer-shell host the pieces are drawn on, published on its own (ADR-0037).
patina-shell = { git = "https://github.com/Sector-F-Labs/patina-shell" }

# Smithay 0.7 with upstream's _NET_ACTIVE_WINDOW fix (2026-10-06) backported:
# 0.7 set it to the root window, so Wine thought its fullscreen games had lost
# focus, and minimised them. Drop this once a Smithay release has the fix.
[patch.crates-io]
smithay = { git = "https://github.com/Sector-F-Labs/smithay", branch = "patina-0.7" }
