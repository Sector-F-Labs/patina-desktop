[workspace]
resolver = "3"
members = ["hud", "clipboard", "clock", "compositor", "dbug", "dictate", "displays", "emoji", "files", "launcher", "lock", "menu", "notebook", "polkit", "power", "processes", "raise", "reader", "screenshot", "session", "settings", "shell", "skin-builder", "system", "tiler", "volume", "wallpaper", "wifi"]

# Patina's develop branch, so desktop work can use Patina changes before
# they're released.
[workspace.dependencies]
patina-ui = { git = "https://github.com/Sector-F-Labs/patina", branch = "develop" }
# Noto Color Emoji for patina::emoji: git only, too big for crates.io (Patina ADR-0031).
patina-emoji-font = { git = "https://github.com/Sector-F-Labs/patina", branch = "develop" }
# The layer-shell host the pieces are drawn on (ADR-0109).
patina-shell = { path = "shell" }

# Smithay 0.7 with two upstream fixes backported. _NET_ACTIVE_WINDOW (2026-10-06):
# 0.7 set it to the root window, so Wine thought its fullscreen games had lost
# focus, and minimised them. WM_STATE from set_suspended (bf188f25), so a game
# minimised on Alt+Tab is told it's restored when it's focused again. Drop this
# once a Smithay release has both.
[patch.crates-io]
smithay = { git = "https://github.com/Sector-F-Labs/smithay", branch = "patina-0.7" }
