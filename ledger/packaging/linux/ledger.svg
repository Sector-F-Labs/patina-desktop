<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- An accounting ledger: a green cloth cover with leather corners and
       spine, a paper label, and the page block showing along the bottom. -->
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7a55"/>
      <stop offset="1" stop-color="#1d5a3c"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2e22"/>
      <stop offset="0.6" stop-color="#6a4332"/>
      <stop offset="1" stop-color="#4a2e22"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="1" stop-color="#e9e2cf"/>
    </linearGradient>
    <clipPath id="cover"><rect x="22" y="12" width="88" height="100" rx="8"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect x="24" y="17" width="88" height="100" rx="8" fill="#000" opacity="0.3" filter="url(#shadow)"/>
  <!-- page block -->
  <rect x="26" y="20" width="86" height="96" rx="5" fill="url(#paper)"/>
  <g stroke="#b9b09a" stroke-width="0.8">
    <line x1="30" y1="112" x2="108" y2="112"/>
    <line x1="30" y1="114" x2="108" y2="114"/>
  </g>
  <!-- cover -->
  <rect x="22" y="12" width="88" height="100" rx="8" fill="url(#cloth)"/>
  <g clip-path="url(#cover)">
    <!-- spine -->
    <rect x="22" y="12" width="16" height="100" fill="url(#leather)"/>
    <rect x="36.5" y="12" width="1.2" height="100" fill="#000" opacity="0.25"/>
    <g fill="#d9b86a" opacity="0.85">
      <rect x="22" y="30" width="16" height="1.6"/>
      <rect x="22" y="48" width="16" height="1.6"/>
      <rect x="22" y="66" width="16" height="1.6"/>
      <rect x="22" y="84" width="16" height="1.6"/>
    </g>
    <!-- corners -->
    <path d="M110 12 v22 l-22 -22 z" fill="url(#leather)"/>
    <path d="M110 112 v-22 l-22 22 z" fill="url(#leather)"/>
  </g>
  <!-- label: a ruled sheet with a few entries -->
  <rect x="48" y="30" width="46" height="40" rx="2.5" fill="url(#paper)" stroke="#8a7a50" stroke-width="1"/>
  <g stroke="#9db7d6" stroke-width="0.9">
    <line x1="51" y1="40" x2="91" y2="40"/>
    <line x1="51" y1="48" x2="91" y2="48"/>
    <line x1="51" y1="56" x2="91" y2="56"/>
    <line x1="51" y1="64" x2="91" y2="64"/>
  </g>
  <line x1="75" y1="33" x2="75" y2="67" stroke="#c9605a" stroke-width="1"/>
  <g fill="#3d4a5c">
    <rect x="53" y="36" width="14" height="2" rx="1"/>
    <rect x="80" y="36" width="9" height="2" rx="1"/>
    <rect x="53" y="44" width="10" height="2" rx="1"/>
    <rect x="78" y="44" width="11" height="2" rx="1"/>
    <rect x="53" y="52" width="16" height="2" rx="1"/>
    <rect x="82" y="52" width="7" height="2" rx="1"/>
  </g>
  <rect x="78" y="60" width="11" height="2.4" rx="1.2" fill="#1d5a3c"/>
  <rect x="22.4" y="12.4" width="87.2" height="99.2" rx="7.6" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="0.8"/>
</svg>
