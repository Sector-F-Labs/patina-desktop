<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="t d">
<title id="t">One window dragged to the left edge, in time</title><desc id="d">The compositor reports the drag, patina-tiler sees the pointer reach the left edge and asks for a preview, and when the window is dropped it places it in the left half.</desc>
<style>:root{--bg:#fdf6e3;--group:#f4f0d9;--gstroke:#e0dcc7;--box:#fffbef;--bstroke:#a6b0a0;--text:#5c6a72;--muted:#708089;--blue:#3a94c5;--green:#8da101;--purple:#df69ba;--tblue:#2d7fa8;--tgreen:#677800;--tpurple:#b54f93;--busfill:#f3ecc2;--busstroke:#dfa000;--red:#f85552;--line:#829181;--note:#e4efe9;}@media (prefers-color-scheme: dark){:root{--bg:#2d353b;--group:#343f44;--gstroke:#475258;--box:#2d353b;--bstroke:#7a8478;--text:#d3c6aa;--muted:#9da9a0;--blue:#7fbbb3;--green:#a7c080;--purple:#d699b6;--tblue:#7fbbb3;--tgreen:#a7c080;--tpurple:#d699b6;--busfill:#4d4c43;--busstroke:#dbbc7f;--red:#e67e80;--line:#859289;--note:#384b55;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--text)}
.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mu{fill:var(--muted);font-size:12px}.s{font-size:11.5px}.e{text-anchor:end}.c{text-anchor:middle}
.h{font-size:14px;font-weight:600}
.bg{fill:var(--bg)}
.grp{fill:var(--group);stroke:var(--gstroke);stroke-width:1.2}
.box{fill:var(--box);stroke:var(--bstroke);stroke-width:1.2}
.bl{stroke:var(--blue);stroke-width:1.6}.gr{stroke:var(--green);stroke-width:1.6}.pu{stroke:var(--purple);stroke-width:1.6}
.tb{fill:var(--tblue)}.tg{fill:var(--tgreen)}.tp{fill:var(--tpurple)}
.bus{fill:var(--busfill);stroke:var(--busstroke);stroke-width:1.4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.dash{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.ah{fill:var(--line)}
.note{fill:var(--note);stroke:var(--blue);stroke-width:1}
.red{fill:var(--red)}.bar{fill:var(--purple)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" width="960" height="630" rx="10"/>
<rect x="44" y="20" width="132" height="40" rx="8" class="box"/><text x="110" y="45" class="b c">You</text>
<line x1="110" y1="60" x2="110" y2="610" class="dash"/>
<rect x="314" y="20" width="132" height="40" rx="8" class="box bl"/><text x="380" y="45" class="b c">Compositor</text>
<line x1="380" y1="60" x2="380" y2="610" class="dash"/>
<rect x="634" y="20" width="132" height="40" rx="8" class="box gr"/><text x="700" y="45" class="b c">patina-tiler</text>
<line x1="700" y1="60" x2="700" y2="610" class="dash"/>

<line x1="110" y1="100" x2="379" y2="100" class="ln" marker-end="url(#a)"/>
<text x="245" y="93" class="s c">drag a window by its title bar</text>
<line x1="380" y1="140" x2="699" y2="140" class="ln" marker-end="url(#a)"/>
<text x="540" y="133" class="s c">DragStarted(id)</text>
<rect x="540" y="160" width="320" height="28" rx="6" class="note"/>
<text x="700" y="178" class="s c">still the owner? is the window one it can place?</text>
<line x1="110" y1="228" x2="379" y2="228" class="ln" marker-end="url(#a)"/>
<text x="245" y="221" class="s c">move the pointer to the left edge</text>
<line x1="380" y1="268" x2="699" y2="268" class="ln" marker-end="url(#a)"/>
<text x="540" y="261" class="s c">DragMotion(id, x, y)</text>
<rect x="570" y="288" width="260" height="28" rx="6" class="note"/>
<text x="700" y="306" class="s c">zone(x, y) is Left: show where</text>
<line x1="700" y1="356" x2="381" y2="356" class="ln" marker-end="url(#a)"/>
<text x="540" y="349" class="s c">ShowPreview(left half)</text>
<rect x="230" y="376" width="300" height="28" rx="6" class="note"/>
<text x="380" y="394" class="s c">blue preview, drawn over the desktop</text>
<line x1="110" y1="444" x2="379" y2="444" class="ln" marker-end="url(#a)"/>
<text x="245" y="437" class="s c">let go</text>
<line x1="380" y1="484" x2="699" y2="484" class="ln" marker-end="url(#a)"/>
<text x="540" y="477" class="s c">DragEnded(id, x, y)</text>
<line x1="700" y1="524" x2="381" y2="524" class="ln" marker-end="url(#a)"/>
<text x="540" y="517" class="s c">Place(id, left half)</text>
<rect x="230" y="544" width="300" height="28" rx="6" class="note"/>
<text x="380" y="562" class="s c">resize the window; hide the preview</text>
<rect x="590" y="544" width="220" height="28" rx="6" class="note"/>
<text x="700" y="562" class="s c">remember: tiled[id] = Left</text>
</svg>
