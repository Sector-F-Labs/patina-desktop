<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 786" width="960" height="786" role="img" aria-labelledby="t d">
<title id="t">One dictation, in time</title><desc id="d">From holding the chord to the text appearing: the compositor signals the daemon, which records, transcribes and calls Commit; the compositor saves the clipboard, serves the text, presses Ctrl+V and gives the clipboard back.</desc>
<style>:root{--bg:#fdf6e3;--group:#f4f0d9;--gstroke:#e0dcc7;--box:#fffbef;--bstroke:#a6b0a0;--text:#5c6a72;--muted:#708089;--blue:#3a94c5;--green:#8da101;--purple:#df69ba;--tblue:#2d7fa8;--tgreen:#677800;--tpurple:#b54f93;--busfill:#f3ecc2;--busstroke:#dfa000;--red:#f85552;--line:#829181;--note:#e4efe9;}@media (prefers-color-scheme: dark){:root{--bg:#2d353b;--group:#343f44;--gstroke:#475258;--box:#2d353b;--bstroke:#7a8478;--text:#d3c6aa;--muted:#9da9a0;--blue:#7fbbb3;--green:#a7c080;--purple:#d699b6;--tblue:#7fbbb3;--tgreen:#a7c080;--tpurple:#d699b6;--busfill:#4d4c43;--busstroke:#dbbc7f;--red:#e67e80;--line:#859289;--note:#384b55;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--text)}
.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mu{fill:var(--muted);font-size:12px}.s{font-size:11.5px}.e{text-anchor:end}.c{text-anchor:middle}
.h{font-size:14px;font-weight:600}
.bg{fill:var(--bg)}
.grp{fill:var(--group);stroke:var(--gstroke);stroke-width:1.2}
.box{fill:var(--box);stroke:var(--bstroke);stroke-width:1.2}
.bl{stroke:var(--blue);stroke-width:1.6}.gr{stroke:var(--green);stroke-width:1.6}.pu{stroke:var(--purple);stroke-width:1.6}
.tb{fill:var(--tblue)}.tg{fill:var(--tgreen)}.tp{fill:var(--tpurple)}
.bus{fill:var(--busfill);stroke:var(--busstroke);stroke-width:1.4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.dash{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.ah{fill:var(--line)}
.note{fill:var(--note);stroke:var(--blue);stroke-width:1}
.red{fill:var(--red)}.bar{fill:var(--purple)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" width="960" height="786" rx="10"/>
<rect x="44.0" y="20" width="132" height="40" rx="8" class="box "/>
<text x="110" y="45" class="b c">You</text>
<line x1="110" y1="60" x2="110" y2="766" class="dash"/>
<rect x="244.0" y="20" width="132" height="40" rx="8" class="box bl"/>
<text x="310" y="45" class="b c">Compositor</text>
<line x1="310" y1="60" x2="310" y2="766" class="dash"/>
<rect x="464.0" y="20" width="132" height="40" rx="8" class="box gr"/>
<text x="530" y="45" class="b c">Dictate daemon</text>
<line x1="530" y1="60" x2="530" y2="766" class="dash"/>
<rect x="664.0" y="20" width="132" height="40" rx="8" class="box pu"/>
<text x="730" y="45" class="b c">Overlay</text>
<line x1="730" y1="60" x2="730" y2="766" class="dash"/>
<rect x="819.0" y="20" width="132" height="40" rx="8" class="box "/>
<text x="885" y="45" class="b c">Focused window</text>
<line x1="885" y1="60" x2="885" y2="766" class="dash"/>
<line x1="110" y1="100" x2="309" y2="100" class="ln" marker-end="url(#a)"/>
<text x="210.0" y="93" class="s c">hold the chord</text>
<line x1="310" y1="134" x2="529" y2="134" class="ln" marker-end="url(#a)"/>
<text x="420.0" y="127" class="s c">DictationStarted</text>
<rect x="455.2" y="154" width="149.60000000000002" height="28" rx="6" class="note"/>
<text x="530" y="172" class="s c">open the microphone</text>
<line x1="530" y1="202" x2="729" y2="202" class="ln" marker-end="url(#a)"/>
<text x="630.0" y="195" class="s c">spawn the overlay</text>
<line x1="530" y1="236" x2="729" y2="236" class="ln" marker-end="url(#a)"/>
<text x="630.0" y="229" class="s c">loudness, 30 a second</text>
<line x1="110" y1="270" x2="309" y2="270" class="ln" marker-end="url(#a)"/>
<text x="210.0" y="263" class="s c">a key of the chord comes up</text>
<rect x="132.79999999999998" y="290" width="354.40000000000003" height="28" rx="6" class="note"/>
<text x="310" y="308" class="s c">first key up stops it; the others may still be held</text>
<line x1="310" y1="338" x2="529" y2="338" class="ln" marker-end="url(#a)"/>
<text x="420.0" y="331" class="s c">DictationStopped</text>
<line x1="530" y1="372" x2="729" y2="372" class="ln" marker-end="url(#a)"/>
<text x="630.0" y="365" class="s c">“transcribing”</text>
<rect x="477.6" y="392" width="104.80000000000001" height="28" rx="6" class="note"/>
<text x="530" y="410" class="s c">Whisper runs</text>
<line x1="530" y1="440" x2="311" y2="440" class="ln" marker-end="url(#a)"/>
<text x="420.0" y="433" class="s c">Commit(text)</text>
<rect x="129.6" y="460" width="360.8" height="28" rx="6" class="note"/>
<text x="310" y="478" class="s c">wait until those keys are up (else Ctrl+Alt+Super+V)</text>
<rect x="171.2" y="494" width="277.6" height="28" rx="6" class="note"/>
<text x="310" y="512" class="s c">read the old clipboard out of its owner</text>
<rect x="196.8" y="528" width="226.4" height="28" rx="6" class="note"/>
<text x="310" y="546" class="s c">serve the text as the clipboard</text>
<line x1="310" y1="576" x2="884" y2="576" class="ln" marker-end="url(#a)"/>
<text x="597.5" y="569" class="s c">press Ctrl+V</text>
<line x1="530" y1="610" x2="729" y2="610" class="ln" marker-end="url(#a)"/>
<text x="630.0" y="603" class="s c">close stdin, it fades out</text>
<line x1="885" y1="644" x2="311" y2="644" class="ln" marker-end="url(#a)"/>
<text x="597.5" y="637" class="s c">asks for the clipboard</text>
<line x1="310" y1="678" x2="884" y2="678" class="ln" marker-end="url(#a)"/>
<text x="597.5" y="671" class="s c">the text</text>
<rect x="164.79999999999998" y="698" width="290.40000000000003" height="28" rx="6" class="note"/>
<text x="310" y="716" class="s c">150 ms later: give the old clipboard back</text>
</svg>
