[package]
name = "patina-dictate"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Speech to text on the machine, with Whisper: for dictating into any field"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[features]
# Whisper on an NVIDIA GPU; needs the CUDA toolkit to build. The CPU otherwise.
cuda = ["whisper-rs/cuda"]
# Whisper through Vulkan, where FreeBSD has a GPU driver.
vulkan = ["whisper-rs/vulkan"]

[dependencies]
egui = "0.35"
hound = "3.5"
patina-shell = { workspace = true }
patina-ui = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
whisper-rs = "0.16"
zbus = "5"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# The microphone: cpal (ALSA, so PipeWire or PulseAudio through it) on Linux,
# the kernel's /dev/dsp on FreeBSD, whatever sound server runs there.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.17"

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"
